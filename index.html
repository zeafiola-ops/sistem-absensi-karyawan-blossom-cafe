<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistem Absensi Karyawan Blossom Cafe</title>

</head>

<body>
<body>

<div class="container-fluid login-page">

    <div class="card shadow login-card p-4">

        <div class="text-center">

           <img src="assets/img/Logo.png" width="100">

            <h2 class="mt-3 fw-bold text-danger">
                Blossom Cafe
            </h2>

            <p class="text-muted">
                Sistem Absensi Karyawan
            </p>

        </div>

        <form>

            <div class="mb-3">

                <label class="form-label">
                    Username
                </label>

                <input
                    type="text"
                    class="form-control"
                    placeholder="Masukkan Username">

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    class="form-control"
                    placeholder="Masukkan Password">

            </div>

            <button class="btn btn-danger w-100">

                Login

            </button>

        </form>

        <div class="text-center mt-3">

            <small class="text-muted">

                Demo Login <br>

                Username :
                <b>admin</b>

                <br>

                Password :
                <b>12345</b>

            </small>

        </div>

    </div>

</div>

</body>

</html>
